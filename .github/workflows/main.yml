name: Build WireGuard Android

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  # 强制使用 Node.js 24，消除 Node 20 弃用警告
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 修正参数名：accept-android-sdk-licenses
          accept-android-sdk-licenses: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: List all APK files (debug)
        if: always()   # 即使构建失败也运行，便于排查
        run: |
          echo "Searching for .apk files:"
          find . -name "*.apk" -type f
          echo ""
          echo "Contents of app/build/outputs/apk/ (if exists):"
          ls -la app/build/outputs/apk/ || echo "Directory not found"

      - name: Upload APK artifact
        if: success()   # 只有构建成功才上传
        uses: actions/upload-artifact@v4
        with:
          name: wireguard-android-release
          # 尝试多个可能的 APK 路径
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/*/release/*.apk
            **/build/outputs/apk/**/*.apk